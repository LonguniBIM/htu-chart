# Phase 1 Ready Quality Configuration for backend/pyproject.toml
# Copy [tool.ruff], [tool.mypy], and [tool.pytest.ini_options] into
# topstep-chart-app/backend/pyproject.toml when initializing Phase 1.

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async (prevents blocking calls in FastAPI/SignalR loop)
    "S",     # flake8-bandit security checks
    "DTZ",   # flake8-datetimez (enforces R05 timezone-aware CME timestamps)
    "TID",   # flake8-tidy-imports
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # handled by line-length formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert is expected in pytest (guarded separately by arch_check TEST-001)
    "S105",  # synthetic test tokens
    "S106",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring local runtime startup",
]
